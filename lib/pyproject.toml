[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-aruba-airwave-connector"
version = "1.0.0"
description = "Monitoreo de infraestructura Aruba con AirWave (API XML): consultar dispositivos y su estado, métricas generales y clientes conectados. Solo lectura"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31,<3.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_aruba_airwave_connector*"]
